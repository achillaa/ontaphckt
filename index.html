<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luyện trắc nghiệm — 91 câu (Offline)</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f2f4f0;color:#1c2417;font-size:19px;line-height:1.5}
  .wrap{max-width:820px;margin:0 auto;padding:16px}
  header.top{background:#2e4a22;color:#fff;padding:20px 16px;text-align:center}
  header.top h1{margin:0 0 6px;font-size:26px}
  header.top p{margin:0;opacity:.9;font-size:16px}
  .card{background:#fff;border:1px solid #d8ddd2;border-radius:12px;padding:20px;margin-top:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .label{font-weight:bold;margin:16px 0 8px}
  .label:first-child{margin-top:0}
  .seg{display:flex;flex-wrap:wrap;gap:8px}
  .seg button{flex:1 1 150px;padding:13px 10px;font-size:17px;border:2px solid #b9c4ae;background:#fff;border-radius:10px;cursor:pointer}
  .seg button.on{background:#2e4a22;color:#fff;border-color:#2e4a22;font-weight:bold}
  .check{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:18px;cursor:pointer}
  .check input{width:22px;height:22px;accent-color:#2e4a22}
  .big{display:block;width:100%;padding:16px;font-size:20px;font-weight:bold;border:none;border-radius:10px;background:#2e4a22;color:#fff;cursor:pointer;margin-top:20px}
  .big:hover{background:#243a1a}
  .big.sec{background:#e6ebdf;color:#2e4a22;border:2px solid #b9c4ae}
  .muted{color:#5a6650;font-size:15px}
  .bar{height:12px;background:#e2e7da;border-radius:6px;overflow:hidden;margin:10px 0 4px}
  .bar>div{height:100%;background:#2e4a22;width:0%}
  .meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:16px;color:#44513c}
  .qtext{font-size:21px;font-weight:bold;margin:14px 0 16px}
  .opt{display:block;width:100%;text-align:left;padding:15px 16px;margin:9px 0;font-size:19px;background:#fbfcfa;border:2px solid #c3cdb8;border-radius:10px;cursor:pointer;line-height:1.45}
  .opt:hover{border-color:#2e4a22}
  .opt.sel{border-color:#2e4a22;background:#eaf0e2}
  .opt.right{background:#dff2d8;border-color:#2c7a1e;font-weight:bold}
  .opt.wrong{background:#fbe0dd;border-color:#b3271e;font-weight:bold}
  .opt:disabled{cursor:default;opacity:1;color:#1c2417}
  .fb{padding:13px 16px;border-radius:10px;margin-top:12px;font-size:18px;display:none}
  .fb.ok{display:block;background:#dff2d8;border:1px solid #2c7a1e}
  .fb.no{display:block;background:#fbe0dd;border:1px solid #b3271e}
  .nav{display:flex;gap:10px;margin-top:18px}
  .nav button{flex:1;padding:15px;font-size:19px;font-weight:bold;border-radius:10px;cursor:pointer;border:2px solid #2e4a22}
  #btnPrev{background:#fff;color:#2e4a22}
  #btnNext{background:#2e4a22;color:#fff}
  .nav button:disabled{opacity:.35;cursor:default}
  .score{font-size:34px;font-weight:bold;text-align:center;margin:6px 0}
  .wrongitem{border-top:1px solid #e0e5d8;padding:12px 0}
  .wrongitem .qq{font-weight:bold}
  .wrongitem .cc{color:#2c7a1e;font-weight:bold}
  .hidden{display:none}
  .qimg{display:block;max-width:100%;margin:4px auto 14px;border:1px solid #c3cdb8;border-radius:10px;background:#fff;cursor:zoom-in}
  .qimg.small{max-width:340px;margin:8px 0}
  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:50;padding:12px;cursor:zoom-out}
  #lightbox img{max-width:100%;max-height:100%;background:#fff;border-radius:8px}
  .fontbtns button{padding:6px 12px;font-size:16px;border:1px solid #b9c4ae;background:#fff;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<header class="top">
  <h1>📝 Luyện Câu Hỏi Trắc Nghiệm</h1>
  <p>91 câu — chạy offline, không cần mạng, không cần đăng nhập</p>
</header>
<div class="wrap">

  <!-- START -->
  <div id="scrStart" class="card">
    <div class="label">1. Chọn phần muốn luyện:</div>
    <div class="seg" id="segPart">
      <button data-v="0" class="on">Tất cả — 91 câu</button>
      <button data-v="1">Phần I — 41 câu<br><span class="muted" style="color:inherit">Quy định, hướng dẫn Ban CHQS xã</span></button>
      <button data-v="2">Phần II — 26 câu<br><span class="muted" style="color:inherit">Tính năng, cấu tạo súng BB</span></button>
      <button data-v="3">Phần III — 24 câu<br><span class="muted" style="color:inherit">Hư hỏng thường gặp, sửa chữa</span></button>
    </div>
    <div class="label">2. Chọn cách làm:</div>
    <div class="seg" id="segMode">
      <button data-v="practice" class="on">Luyện tập<br><span class="muted" style="color:inherit">Trả lời câu nào biết đúng/sai ngay câu đó</span></button>
      <button data-v="exam">Thi thử<br><span class="muted" style="color:inherit">Làm hết rồi mới chấm điểm một lần</span></button>
    </div>
    <div class="label">3. Tùy chọn:</div>
    <label class="check"><input type="checkbox" id="chkShuffleQ" checked> Trộn thứ tự câu hỏi</label>
    <label class="check"><input type="checkbox" id="chkShuffleA" checked> Trộn thứ tự đáp án A, B, C, D</label>
    <button class="big" id="btnStart">▶ Bắt đầu làm bài</button>
    <p class="muted">Lưu ý: File gốc không có Câu 20 (nhảy từ Câu 19 sang Câu 21) nên bộ đề có 91 câu. Đáp án lấy đúng theo phần tô đỏ trong file gốc.</p>
  </div>

  <!-- QUIZ -->
  <div id="scrQuiz" class="card hidden">
    <div class="meta">
      <span id="mPos"></span><span id="mScore"></span>
      <span class="fontbtns">Cỡ chữ: <button id="fMinus">A−</button> <button id="fPlus">A+</button></span>
    </div>
    <div class="bar"><div id="barFill"></div></div>
    <div class="muted" id="mOrigin"></div>
    <div class="qtext" id="qText"></div>
    <div id="qImgBox"></div>
    <div id="optBox"></div>
    <div class="fb" id="fbBox"></div>
    <div class="nav">
      <button id="btnPrev">← Câu trước</button>
      <button id="btnNext">Câu tiếp →</button>
    </div>
    <button class="big sec" id="btnFinish" style="margin-top:12px">✔ Nộp bài / Xem kết quả</button>
  </div>

  <!-- RESULT -->
  <div id="scrResult" class="card hidden">
    <div style="text-align:center" class="muted">KẾT QUẢ</div>
    <div class="score" id="rScore"></div>
    <div style="text-align:center" id="rDetail"></div>
    <div id="rWrong"></div>
    <button class="big" id="btnRetryWrong">↻ Luyện lại các câu sai</button>
    <button class="big sec" id="btnRestart">Làm lại từ đầu (bộ đã chọn)</button>
    <button class="big sec" id="btnHome">Về trang đầu — chọn phần khác</button>
  </div>

</div>
<div id="lightbox"><img id="lightboxImg" alt="Hình phóng to"></div>

 giờ kỹ thuật trong ngày khi thực hiện lau chùi, bảo quản vũ khí, khí tài vào đầu giờ thứ 8:", "o": [{"t": "Từ 5 đến 10 phút"}, {"t": "Từ 10 đến 15 phút"}, {"t": "Từ 15 đến 20 phút"}, {"t": "Từ 20 đến 25 phút"}], "a": 2}, {"n": 87, "s": 3, "q": "Nội dung bảo quản thường xuyên VKTBKT:", "o": [{"t": "Làm sạch, lau chùi bụi bẩn trên bề mặt VKTBKT"}, {"t": "Củng cố, che đậy, tránh mưa nắng cho VKTBKT"}, {"t": "Kiểm tra tình trạng kỹ thuật, mức độ đồng bộ của VKTBKT"}, {"t": "VKTBKT để ngoài trời sáng lau sương, chiều lau bụi, sau trận mưa phải lau chùi bảo quản."}, {"t": "Cả 4 phương án trên đều đúng"}], "a": 4}, {"n": 88, "s": 3, "q": "Khi tiến hành hiệu chỉnh đường ngắm cho súng — Đối với khe ngắm:", "o": [{"t": "Hiệu chỉnh cùng chiều sai lệch"}, {"t": "Hiệu chỉnh ngược chiều sai lệch"}], "a": 1}, {"n": 89, "s": 3, "q": "Khi tiến hành hiệu chỉnh đường ngắm cho súng — Đối với đầu ngắm:", "o": [{"t": "Hiệu chỉnh cùng chiều sai lệch"}, {"t": "Hiệu chỉnh ngược chiều sai lệch"}], "a": 0}, {"n": 90, "s": 3, "q": "Dụng cụ phụ tùng theo súng trung liên RPD bao gồm bao nhiêu cái:", "o": [{"t": "10 cái"}, {"t": "12 cái"}, {"t": "14 cái"}], "a": 1, "e": "Súng trung liên RPD sử dụng bộ phụ tùng và thông nòng để trong hộp đặt bên trong phía sau báng, bao gồm 12 món đồng bộ.", "img": "i3"}, {"n": 91, "s": 3, "q": "Bảo quản hàng tuần gồm mấy nội dung:", "o": [{"t": "4 nội dung"}, {"t": "5 nội dung"}, {"t": "6 nội dung"}], "a": 1, "e": "5 nội dung: (1) Kiểm tra, vệ sinh sạch sẽ vũ khí và nơi để vũ khí trang bị kỹ thuật; (2) Kiểm tra sự toàn vẹn của vũ khí trang bị kỹ thuật; (3) Lau sạch bụi bẩn, mở các nắp để hong phơi các bộ phận bên trong; (4) Kiểm tra tình trạng kỹ thuật; (5) Kiểm tra đồng bộ phụ tùng, vật tư kỹ thuật đi kèm."}, {"n": 92, "s": 3, "q": "Nội dung bảo quản hàng tháng có mấy nội dung:", "o": [{"t": "5 nội dung"}, {"t": "6 nội dung"}, {"t": "7 nội dung"}], "a": 2, "e": "7 nội dung: 5 nội dung của bảo quản hàng tuần, cộng thêm: (6) Thực hiện nội dung bảo quản hàng tuần; (7) Kiểm tra vận hành cơ động vũ khí trang bị kỹ thuật."}];
let part=0, mode='practice';
let quiz=[], cur=0, answers={}, locked={}, fontSize=19;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function segWire(id, cb){
  const box=document.getElementById(id);
  box.querySelectorAll('button').forEach(b=>b.onclick=()=>{box.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');cb(b.dataset.v);});
}
segWire('segPart', v=>part=+v);
segWire('segMode', v=>mode=v);

function buildQuiz(list){
  let items=list.map(q=>({n:q.n,s:q.s,q:q.q,e:q.e||'',img:q.img||null,opts:q.o.map((o,i)=>({t:o.t, ok:i===q.a}))}));
  if(document.getElementById('chkShuffleQ').checked) shuffle(items);
  if(document.getElementById('chkShuffleA').checked) items.forEach(it=>shuffle(it.opts));
  return items;
}
function start(list){
  quiz=list; cur=0; answers={}; locked={};
  show('scrQuiz'); render();
}
document.getElementById('btnStart').onclick=()=>{
  const list = part===0 ? DATA : DATA.filter(q=>q.s===part);
  start(buildQuiz(list));
};
function show(id){
  ['scrStart','scrQuiz','scrResult'].forEach(x=>document.getElementById(x).classList.toggle('hidden', x!==id));
  window.scrollTo(0,0);
}
function correctCount(){let c=0;quiz.forEach((it,i)=>{if(answers[i]!==undefined && it.opts[answers[i]].ok)c++;});return c;}
function render(){
  const it=quiz[cur], total=quiz.length;
  document.getElementById('mPos').textContent='Câu '+(cur+1)+' / '+total;
  document.getElementById('mScore').textContent = mode==='practice' ? ('Đúng: '+correctCount()+' câu') : ('Đã trả lời: '+Object.keys(answers).length+'/'+total);
  document.getElementById('barFill').style.width=Math.round(((cur+1)/total)*100)+'%';
  document.getElementById('mOrigin').textContent='Câu gốc số '+it.n+' — Phần '+['','I','II','III'][it.s];
  document.getElementById('qText').textContent=it.q;
  const ib=document.getElementById('qImgBox'); ib.innerHTML='';
  if(it.img && IMAGES[it.img]){ const im=document.createElement('img'); im.className='qimg'; im.src=IMAGES[it.img]; im.alt='Hình minh họa câu '+it.n; im.onclick=()=>openLightbox(im.src); ib.appendChild(im); }
  const box=document.getElementById('optBox'); box.innerHTML='';
  const letters=['A','B','C','D','E'];
  it.opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt'; b.textContent=letters[i]+'. '+o.t;
    const isLocked = mode==='practice' && locked[cur];
    if(answers[cur]===i) b.classList.add('sel');
    if(isLocked){
      b.disabled=true;
      if(o.ok) b.classList.add('right');
      else if(answers[cur]===i) b.classList.add('wrong');
    }
    b.onclick=()=>pick(i);
    box.appendChild(b);
  });
  const fb=document.getElementById('fbBox');
  if(mode==='practice' && locked[cur]){
    const ok=it.opts[answers[cur]].ok;
    fb.className='fb '+(ok?'ok':'no');
    let msg = ok ? '✅ Đúng rồi!' : ('❌ Chưa đúng. Đáp án đúng là: <b>'+letters[it.opts.findIndex(o=>o.ok)]+'. '+it.opts.find(o=>o.ok).t+'</b>');
    if(it.e) msg += '<br><span>💡 '+it.e+'</span>';
    fb.innerHTML=msg;
  } else { fb.className='fb'; fb.innerHTML=''; }
  document.getElementById('btnPrev').disabled = cur===0;
  document.getElementById('btnNext').disabled = cur===total-1;
  document.getElementById('btnNext').textContent = cur===total-1 ? 'Câu tiếp →' : 'Câu tiếp →';
}
function pick(i){
  if(mode==='practice' && locked[cur]) return;
  answers[cur]=i;
  if(mode==='practice') locked[cur]=true;
  render();
}
document.getElementById('btnPrev').onclick=()=>{if(cur>0){cur--;render();window.scrollTo(0,0);}};
document.getElementById('btnNext').onclick=()=>{if(cur<quiz.length-1){cur++;render();window.scrollTo(0,0);}};
document.getElementById('btnFinish').onclick=()=>{
  const unanswered = quiz.filter((_,i)=>answers[i]===undefined).length;
  if(unanswered>0 && !confirm('Còn '+unanswered+' câu chưa trả lời. Vẫn xem kết quả chứ?')) return;
  finish();
};
function finish(){
  const total=quiz.length, c=correctCount();
  document.getElementById('rScore').textContent=c+' / '+total+' câu đúng';
  document.getElementById('rDetail').innerHTML='Đạt <b>'+Math.round(c/total*100)+'%</b>'+(c===total?' — Xuất sắc, đúng hết! 🎉':(c/total>=0.8?' — Rất tốt!':' — Ôn lại các câu sai bên dưới nhé.'));
  const letters=['A','B','C','D','E'];
  const wrong=quiz.map((it,i)=>({it,i})).filter(({it,i})=>!(answers[i]!==undefined && it.opts[answers[i]].ok));
  const rw=document.getElementById('rWrong');
  if(wrong.length===0){ rw.innerHTML=''; }
  else{
    rw.innerHTML='<div class="label" style="margin-top:22px">Các câu cần ôn lại ('+wrong.length+' câu):</div>'+wrong.map(({it,i})=>{
      const yours = answers[i]===undefined ? '<i>Chưa trả lời</i>' : letters[answers[i]]+'. '+it.opts[answers[i]].t;
      const right = it.opts.find(o=>o.ok);
      return '<div class="wrongitem"><div class="qq">Câu gốc '+it.n+': '+it.q+'</div>'+(it.img&&IMAGES[it.img]?'<img class="qimg small" src="'+IMAGES[it.img]+'" onclick="openLightbox(this.src)">':'')+'<div>Bạn chọn: '+yours+'</div><div class="cc">Đáp án đúng: '+letters[it.opts.indexOf(right)]+'. '+right.t+'</div>'+(it.e?'<div class="muted">💡 '+it.e+'</div>':'')+'</div>';
    }).join('');
  }
  document.getElementById('btnRetryWrong').style.display = wrong.length? 'block':'none';
  document.getElementById('btnRetryWrong').onclick=()=>{
    const list=wrong.map(({it})=>DATA.find(d=>d.n===it.n));
    start(buildQuiz(list));
  };
  show('scrResult');
}
document.getElementById('btnRestart').onclick=()=>{ start(buildQuiz(part===0?DATA:DATA.filter(q=>q.s===part))); };
document.getElementById('btnHome').onclick=()=>show('scrStart');
function openLightbox(src){document.getElementById('lightboxImg').src=src;document.getElementById('lightbox').style.display='flex';}
document.getElementById('lightbox').onclick=()=>{document.getElementById('lightbox').style.display='none';};
document.getElementById('fPlus').onclick=()=>{fontSize=Math.min(24,fontSize+1);document.body.style.fontSize=fontSize+'px';};
document.getElementById('fMinus').onclick=()=>{fontSize=Math.max(16,fontSize-1);document.body.style.fontSize=fontSize+'px';};
</script>
</body>
</html>
